name: Issue triage

on:
  issues:
    types: [opened]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode triage
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4.1-flash
          prompt: |
            Ты — триаж-агент проекта «Календарь звонков»:
            Express + SQLite + React/Vite, контракт API описан в api/.

            Только что создана новая issue. В ней может не быть готового
            решения — это жалоба пользователя. Твоя задача — превратить её
            в рабочую постановку.

            Перед ответом прочитай:
            - AGENTS.md — правила проекта и команды;
            - GLOSSARY.md — термины (Гость, Владелец, Слот, Бронь);
            - docs/spec.md — что приложение должно делать;
            - код в api/, server/ и client/, которого касается жалоба.
            Не читай весь репозиторий: иди от жалобы к файлам.

            Оставь в issue ровно один комментарий на русском:
            1. «Как я понял проблему» — 1–3 предложения, без домыслов.
            2. «Воспроизведение» — шаги, ожидаемое и фактическое поведение.
            3. «Причина» — конкретные файлы, функции или строки. Если причина
               не подтверждена, напиши, что именно нужно проверить.
            4. «Затронутые части» — какие слои реально нужно менять:
               api/, server/, client/, db/, docs/. Не перечисляй всё подряд.
            5. «План исправления» — шаги, тесты, риски. Отметь решения,
               которые должен принять человек.
            6. «Чего не хватает» — не больше трёх вопросов к автору, если
               постановка неполная.
            7. «Что считается исправлением» — проверяемые критерии готовности.

            В конце предложи 1–3 метки из docs/agents/triage-labels.md,
            но не применяй их.

            Правила:
            - Не меняй файлы, не создавай ветки, коммиты и PR.
            - Не выдумывай поведение: если чего-то нет в коде или
              docs/spec.md, так и напиши.
            - Ссылайся на пути файлов и существующие issue/спеки.
            - Не добавляй метки и не закрывай issue.
            - Если жалоба — дубликат известной issue, укажи это и дай ссылку.
